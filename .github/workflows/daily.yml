name: Publication quotidienne
on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC = 08:00 à Goma (UTC+2). Adaptez selon votre fuseau.
  workflow_dispatch:       # permet de lancer manuellement pour tester
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node generate.mjs
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          NEWS_LANG: fr
          GSC_TOKEN: ${{ vars.GSC_TOKEN }}
      - run: |
          git config user.name "The-Bible-Talks Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Publication $(date +%F)" || exit 0
          git push